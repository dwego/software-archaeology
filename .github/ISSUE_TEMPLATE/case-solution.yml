name: Submit Investigation
description: Submit your investigation for a Software Archaeology case
title: "[INVESTIGATION] "
labels:
  - investigation

body:
  - type: input
    id: case
    attributes:
      label: Case
      placeholder: "001"
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: List the findings you identified during the investigation.
      placeholder: |
        - finding-id
        - another-finding-id
    validations:
      required: true

  - type: input
    id: fault_change
    attributes:
      label: Fault-introducing Change
      description: Identify the change that introduced the incident.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting Evidence
      description: List the recovered artifacts that support your findings.
      placeholder: |
        - document-id
        - log-id
        - commit
    validations:
      required: true

  - type: textarea
    id: corrective_findings
    attributes:
      label: Corrective Findings
      description: List the corrective actions required to restore the system.
      placeholder: |
        - corrective-action-id
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Investigation Explanation
      description: Explain how the evidence supports your reconstruction of the incident.
    validations:
      required: true

  - type: checkboxes
    id: declaration
    attributes:
      label: Investigation Declaration
      options:
        - label: I based this investigation on evidence recovered from the case.
          required: true